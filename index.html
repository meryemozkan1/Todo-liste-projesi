<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f3f5ff"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236b63e8'/%3E%3Cpath d='M19 18h26a4 4 0 0 1 4 4v29H15V22a4 4 0 0 1 4-4Z' fill='white'/%3E%3Cpath d='m22 31 3 3 5-6m-8 13 3 3 5-6m5-7h7m-7 13h7' fill='none' stroke='%236b63e8' stroke-linecap='round' stroke-linejoin='round' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>TaskMaster | Professional To-Do App</title>
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="card w-100 mt-3">
          <div class="card-header">
            <div class="app-heading">
              <span class="app-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="m8 12 2.5 2.5L16.5 8.5M7 4.75h10A2.25 2.25 0 0 1 19.25 7v12A1.25 1.25 0 0 1 18 20.25H6A1.25 1.25 0 0 1 4.75 19V7A2.25 2.25 0 0 1 7 4.75Z" />
                </svg>
              </span>
              <div>
                <p class="eyebrow">GÜNÜNÜ PLANLA</p>
                <h1 class="card-title">Todo Listesi</h1>
              </div>
            </div>
          </div>
          <div class="card-body">
            <form id="todoAddForm" class="mt-2">
              <label class="sr-only" for="todoName">Yeni görev</label>
              <input
                type="text"
                class="form-control mt-2"
                id="todoName"
                aria-describedby="todo"
                placeholder="Bugün ne yapman gerekiyor?"
                autocomplete="off"
              />

              <button
                id="todoAddButton"
                type="submit"
                class="btn btn-primary"
              >
                <span aria-hidden="true">+</span>
                Görev ekle
              </button>
            </form>
          </div>

          <div class="card-body">
            <div class="list-heading">
              <div>
                <p class="eyebrow">YAPILACAKLAR</p>
                <h2 class="card-title">Görevlerin</h2>
              </div>
            </div>
            <form name="form2" id="todoListForm">
              <label class="sr-only" for="todoSearch">Görevlerde ara</label>
              <input
                id="todoSearch"
                type="text"
                class="form-control mt-3"
                placeholder="Görevlerinde ara..."
                autocomplete="off"
              />
            </form>

            <ul class="list-group" aria-label="Görev listesi">
              <!--
                        <li class="list-group-item d-flex justify-content-between">Todo 1
                            <a href="#" class="delete-item">
                                <i class="fa fa-remove"></i>
                            </a>
                        </li>
                    -->
            </ul>

            <button type="button" id="clearButton" class="btn btn-primary btn-sm">
              Tüm görevleri temizle
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
